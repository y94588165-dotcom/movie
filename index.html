<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Streamer</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Streamer">
<meta name="theme-color" content="#0d0d0f">
<style>
  :root{--bg:#0d0d0f;--fg:#eee;--dim:#888;--acc:#4ade80;--safe:env(safe-area-inset-top)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font:16px/1.5 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg);
       padding-top:var(--safe);overscroll-behavior:none;display:flex;flex-direction:column;min-height:100%}
  header{display:flex;gap:8px;padding:12px;position:sticky;top:0;background:#0d0d0fee;
         backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #222;z-index:5}
  input,select,button{font:inherit;background:#1a1a1e;color:var(--fg);border:1px solid #333;
        border-radius:10px;padding:11px 13px;font-size:16px}
  input[type=search]{flex:1;min-width:0}
  button{cursor:pointer}
  button:active{border-color:var(--acc);color:var(--acc)}
  #grid,#dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;padding:12px}
  .card{cursor:pointer}
  .card img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:#1a1a1e;display:block}
  .card span{display:block;font-size:11px;color:var(--dim);margin-top:4px;line-height:1.3}
  .card b{font-weight:600;font-size:12px;display:block;line-height:1.3}
  .card .wrap{position:relative}
  .card .rm{position:absolute;top:4px;right:4px;padding:2px 7px;border-radius:999px;
            font-size:12px;line-height:1.4;background:#000000aa;border-color:#444}
  .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:#000000aa;border-radius:0 0 8px 8px;overflow:hidden}
  .prog u{display:block;height:100%;background:var(--acc)}
  .meta{color:var(--dim);font-size:10px}
  #view{display:none}
  #bar{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap;align-items:center}
  #title{flex:1;min-width:140px;font-size:15px;font-weight:600;line-height:1.3}
  #bar select{padding:9px 10px;font-size:15px}
  #resume{display:flex;gap:8px;align-items:center;padding:0 12px 10px}
  #resume button{padding:8px 12px;font-size:13px;border-radius:999px}
  #r-go{border-color:#2f4a38;background:#122019;color:var(--acc)}
  .media{width:100%;height:calc(100dvh - 250px);border:0;background:#000;display:block}
  #hint{padding:12px;color:var(--dim);font-size:13px}
  footer{margin-top:auto;padding:14px 12px calc(14px + env(safe-area-inset-bottom));
         color:#666;font-size:11px;text-align:center;line-height:1.5}
  #sheet{position:fixed;inset:0;background:#000000aa;display:flex;align-items:flex-end;z-index:20}
  #sheet[hidden]{display:none}
  .sh{background:#141417;border-top:1px solid #2a2a2e;border-radius:16px 16px 0 0;width:100%;
      max-height:82dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
  .sh-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #222}
  .sh-head strong{flex:1;font-size:15px}
  .sh-head button{padding:6px 10px;font-size:14px}
  #sh-body{overflow:auto;padding:10px 14px 4px}
  .qrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;
        padding:9px 0;border-bottom:1px solid #1e1e22}
  .qrow .ql{font-weight:600;font-size:15px}
  .qrow .qs{color:var(--dim);font-size:12px;display:block;font-weight:400}
  .qrow button{padding:8px 12px;font-size:14px}
  .qrow a{text-decoration:none;color:var(--dim);font-size:18px;padding:0 4px}
  .qrow a:active{color:var(--acc)}
  .pg{grid-column:1/-1;height:3px;background:#26262b;border-radius:2px;overflow:hidden;display:none}
  .pg u{display:block;height:100%;width:0;background:var(--acc)}
  .pg.on{display:block}
  .mut{color:var(--dim);font-size:13px;margin:10px 0}
  .sh-foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid #222}
  .sh-foot>*{flex:1;text-align:center;padding:10px;font-size:14px;border-radius:10px;
             border:1px solid #333;background:#1a1a1e;color:var(--fg);text-decoration:none}
  .fmt{display:flex;gap:8px;margin:4px 0 10px}
  .fmt button{flex:1;padding:8px;font-size:14px}
  .fmt button.on{border-color:var(--acc);color:var(--acc)}
  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
         background:#222;border:1px solid #333;padding:9px 14px;border-radius:10px;font-size:13px;
         z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
  #toast.on{opacity:1}
  @media(min-width:760px){
    #grid,#dgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
    .media{height:min(72vh,600px)}
    .sh{max-width:560px;margin:0 auto;border-radius:16px;margin-bottom:6dvh}
  }
</style>
</head>
<body>
<header>
  <input id="q" type="search" placeholder="Search a movie or show…" autocomplete="off"
         autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
  <button id="guard" title="Block ads and pop-ups">🛡</button>
  <button id="dlb" title="Downloads">⤓</button>
  <button id="back" hidden>←</button>
</header>

<div id="hint">Search for something to start.</div>
<div id="grid"></div>
<div id="dgrid" hidden></div>

<div id="view">
  <div id="bar">
    <strong id="title"></strong>
    <select id="season" hidden></select>
    <select id="episode" hidden></select>
    <select id="src"></select>
    <button id="get">⤓</button>
    <button id="tab">↗</button>
  </div>
  <div id="resume" hidden>
    <button id="r-go"></button>
    <button id="r-new">↺ Start over</button>
  </div>
  <iframe id="frame" class="media" allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          allowfullscreen referrerpolicy="origin"></iframe>
  <video id="vid" class="media" hidden controls playsinline></video>
</div>

<footer>
  This product uses the TMDB API but is not endorsed or certified by TMDB.
</footer>

<div id="sheet" hidden>
  <div class="sh">
    <div class="sh-head">
      <strong id="sh-t">Download</strong>
      <button id="sh-x">✕</button>
    </div>
    <div id="sh-body"></div>
    <div class="sh-foot">
      <a id="sh-page" target="_blank" rel="noopener">Open download page ↗</a>
      <button id="sh-copy">Copy link</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const TMDB_KEY = '67d482763813a641bc480254d6ad2ddd';

const SOURCES = [
  { n:'VidLink',   m:t=>`https://vidlink.pro/movie/${t}`,           tv:(t,s,e)=>`https://vidlink.pro/tv/${t}/${s}/${e}` },
  { n:'vidsrc.to', m:t=>`https://vidsrc.to/embed/movie/${t}`,        tv:(t,s,e)=>`https://vidsrc.to/embed/tv/${t}/${s}/${e}` },
  { n:'embed.su',  m:t=>`https://embed.su/embed/movie/${t}`,         tv:(t,s,e)=>`https://embed.su/embed/tv/${t}/${s}/${e}` },
  { n:'moviesapi', m:t=>`https://moviesapi.club/movie/${t}`,         tv:(t,s,e)=>`https://moviesapi.club/tv/${t}-${s}-${e}` },
  { n:'autoembed', m:t=>`https://autoembed.cc/embed/movie/${t}`,     tv:(t,s,e)=>`https://autoembed.cc/embed/tv/${t}/${s}/${e}` },
  { n:'2embed',    m:t=>`https://www.2embed.cc/embed/${t}`,          tv:(t,s,e)=>`https://www.2embed.cc/embedtv/${t}&s=${s}&e=${e}` },
  { n:'smashy',    m:t=>`https://player.smashy.stream/movie/${t}`,   tv:(t,s,e)=>`https://player.smashy.stream/tv/${t}?s=${s}&e=${e}` },
  { n:'vidsrc.xyz',m:t=>`https://vidsrc.xyz/embed/movie?tmdb=${t}`,  tv:(t,s,e)=>`https://vidsrc.xyz/embed/tv?tmdb=${t}&season=${s}&episode=${e}` },
];

const DL = 'https://dl.vidsrc.party';
const DL_CACHE = 'dl-files-v1';
const DL_STORE = 'streamer.downloads.v1';
const POS_KEY = 'streamer.pos.v1';
const GUARD_KEY = 'streamer.strict';

// no allow-popups / allow-top-navigation / allow-modals = no ad tabs, no alert spam
const SANDBOX = 'allow-scripts allow-same-origin allow-forms allow-presentation allow-orientation-lock';
const PLAYER_HOSTS = ['vidlink.pro','vidsrc.to','embed.su','moviesapi.club','autoembed.cc','2embed.cc','smashy.stream','vidsrc.xyz'];

const $ = id => document.getElementById(id);
const grid = $('grid'), dgrid = $('dgrid'), view = $('view'), frame = $('frame'), vid = $('vid');
const hint = $('hint'), sheet = $('sheet'), shBody = $('sh-body');
let current = null, timer, fmt = 'mp4', subs = '', busy = new Set();
let resumeT = 0, runtime = 0, clock = null;

const esc = s => (s || '').replace(/[<>&"]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));
const mmss = s => {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
};

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ---------- ad guard ---------- */

function applyGuard() {
  const strict = localStorage.getItem(GUARD_KEY) !== '0';
  if (strict) frame.setAttribute('sandbox', SANDBOX);
  else frame.removeAttribute('sandbox');
  $('guard').style.opacity = strict ? 1 : .4;
}
$('guard').onclick = () => {
  const strict = localStorage.getItem(GUARD_KEY) !== '0';
  localStorage.setItem(GUARD_KEY, strict ? '0' : '1');
  applyGuard();
  toast(strict ? 'Ad blocking off for this source' : 'Ad blocking on');
  if (current) play();
};

/* ---------- watch position ---------- */

function allPos() {
  try { return JSON.parse(localStorage.getItem(POS_KEY)) || {}; } catch { return {}; }
}
function posId() {
  if (!current) return '';
  return current.type === 'tv'
    ? `tv:${current.id}:s${$('season').value || 1}e${$('episode').value || 1}`
    : `movie:${current.id}`;
}
const isDone = r => r && r.d > 0 && r.t > Math.min(r.d - 60, r.d * 0.95);

function setPos(t, d) {
  const id = posId();
  if (!id || !current) return;
  const all = allPos();
  const prev = all[id] || {};
  all[id] = {
    t: Math.round(t), d: Math.round(d || prev.d || runtime || 0), ts: Date.now(),
    title: current.title, type: current.type, id: current.id,
    poster: current.poster, s: +$('season').value || 1, e: +$('episode').value || 1
  };
  const keys = Object.keys(all).sort((a, b) => all[b].ts - all[a].ts).slice(0, 80);
  const out = {};
  keys.forEach(k => { if (Date.now() - all[k].ts < 15552000000) out[k] = all[k]; });
  try { localStorage.setItem(POS_KEY, JSON.stringify(out)); } catch {}
}

function startClock() {
  stopClock();
  clock = { base: resumeT, wall: Date.now(), frozen: false };
  clock.iv = setInterval(persist, 5000);
}
function stopClock() {
  if (clock) { persist(); clearInterval(clock.iv); clock = null; }
}
function persist() {
  if (!clock || clock.frozen) return;
  setPos(clock.base + (Date.now() - clock.wall) / 1000, runtime);
}
document.addEventListener('visibilitychange', () => {
  if (!clock) return;
  if (document.hidden) { persist(); clock.frozen = true; }
  else { clock.frozen = false; clock.wall = Date.now(); }
});

// real position when the player reports it
window.addEventListener('message', e => {
  if (!PLAYER_HOSTS.includes(e.origin.replace(/^https?:\/\//, ''))) return;
  let d = e.data;
  if (typeof d === 'string') { try { d = JSON.parse(d); } catch { return; } }
  if (!d || typeof d !== 'object') return;
  const p = (d.data && typeof d.data === 'object') ? d.data : d;
  const dur = Number(p.duration);
  if (dur > 0) runtime = dur;
  const t = Number(p.currentTime ?? p.time ?? p.position ?? p.t);
  if (!Number.isFinite(t) || t <= 0) return;
  if (clock) { clock.base = t; clock.wall = Date.now(); }
  resumeT = t;
  updateChip();
});

function seek(t) {
  if (!t) return;
  const msgs = [
    { event: 'seek', data: { seconds: t } },
    { event: 'seekTo', data: { time: t } },
    { type: 'seek', time: t },
    { type: 'PLAYER_EVENT', data: { event: 'seek', currentTime: t } }
  ];
  msgs.forEach(m => { try { frame.contentWindow.postMessage(m, '*'); } catch {} });
}

function updateChip() {
  const el = $('resume');
  if (!resumeT || resumeT < 15) { el.hidden = true; return; }
  el.hidden = false;
  const pct = runtime ? Math.min(99, Math.round(resumeT / runtime * 100)) : 0;
  $('r-go').textContent = `▶ Jump to ${mmss(resumeT)}${pct ? ' · ' + pct + '%' : ''}`;
}

/* ---------- search ---------- */

$('q').addEventListener('input', () => {
  clearTimeout(timer);
  const q = $('q').value.trim();
  if (q.length < 2) { if (!q) home(); return; }
  timer = setTimeout(() => search(q), 320);
});
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(timer); const q = $('q').value.trim(); if (q) search(q); }
});

function home() {
  stopClock();
  dgrid.hidden = true;
  view.style.display = 'none';
  $('back').hidden = true;
  grid.innerHTML = '';
  const list = Object.values(allPos())
    .filter(r => r.t > 30 && !isDone(r))
    .sort((a, b) => b.ts - a.ts)
    .slice(0, 24);

  hint.textContent = list.length ? 'Continue watching' : 'Search for something to start.';
  list.forEach(r => {
    const c = document.createElement('div');
    c.className = 'card';
    const pct = r.d ? Math.min(100, r.t / r.d * 100) : 0;
    c.innerHTML = `<div class="wrap"><img loading="lazy" src="${esc(r.poster)}" alt="">
        <i class="prog"><u style="width:${pct}%"></u></i></div>
      <b>${esc(r.title)}</b>
      <span class="meta">${r.type === 'tv' ? `S${r.s} E${r.e} · ` : ''}${mmss(r.t)}${r.d ? ' / ' + mmss(r.d) : ''}</span>`;
    c.onclick = () => open({ id: r.id, media_type: r.type, title: r.title, poster_path: r.poster, s: r.s, e: r.e });
    grid.append(c);
  });
}

async function search(q) {
  stopClock();
  dgrid.hidden = true;
  view.style.display = 'none';
  $('back').hidden = true;
  hint.textContent = 'Searching…';
  grid.innerHTML = '';
  try {
    const r = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}`);
    const d = await r.json();
    const hits = (d.results || []).filter(x => x.media_type === 'movie' || x.media_type === 'tv').slice(0, 40);
    hint.textContent = hits.length ? '' : 'Nothing found.';
    const pos = allPos();
    hits.forEach(x => {
      const c = document.createElement('div');
      c.className = 'card';
      const date = (x.release_date || x.first_air_date || '').slice(0, 4);
      const img = x.poster_path ? `https://image.tmdb.org/t/p/w342${x.poster_path}` : '';
      const rec = pos[`${x.media_type}:${x.id}`];
      const bar = rec && !isDone(rec) && rec.d
        ? `<i class="prog"><u style="width:${Math.min(100, rec.t / rec.d * 100)}%"></u></i>` : '';
      c.innerHTML = `<div class="wrap"><img loading="lazy" src="${img}" alt="">${bar}</div>
        <b>${esc(x.title || x.name)}</b><span>${date} · ${x.media_type}</span>`;
      c.onclick = () => open(x);
      grid.append(c);
    });
  } catch { hint.textContent = 'Search failed. Check your connection.'; }
}

/* ---------- player ---------- */

async function open(item) {
  stopClock();
  current = {
    id: item.id, type: item.media_type, title: item.title || item.name,
    poster: item.poster_path ? `https://image.tmdb.org/t/p/w342${item.poster_path}` : ''
  };
  runtime = 0;
  $('title').textContent = current.title;
  grid.innerHTML = ''; dgrid.hidden = true; hint.textContent = '';
  view.style.display = 'block';
  $('back').hidden = false;
  $('src').innerHTML = SOURCES.map((s, i) => `<option value="${i}">${s.n}</option>`).join('');

  if (current.type === 'tv') {
    $('season').hidden = $('episode').hidden = false;
    $('season').innerHTML = '<option value="1">S1</option>';
    fillEpisodes();
    $('season').value = item.s || 1;
    $('episode').value = item.e || 1;
    try {
      const r = await fetch(`https://api.themoviedb.org/3/tv/${current.id}?api_key=${TMDB_KEY}`);
      const d = await r.json();
      const n = d.number_of_seasons || 1;
      $('season').innerHTML = Array.from({length:n}, (_, i) => `<option value="${i+1}">S${i+1}</option>`).join('');
      $('season').value = item.s || 1;
      $('episode').value = item.e || 1;
      runtime = (d.episode_run_time && d.episode_run_time[0]) || 0;
    } catch {}
  } else {
    $('season').hidden = $('episode').hidden = true;
    try {
      const r = await fetch(`https://api.themoviedb.org/3/movie/${current.id}?api_key=${TMDB_KEY}`);
      const d = await r.json();
      runtime = (d.runtime || 0) * 60;
    } catch {}
  }

  const rec = allPos()[posId()];
  resumeT = rec && rec.t > 15 && !isDone(rec) ? rec.t : 0;
  if (rec && rec.d) runtime = runtime || rec.d;
  setPos(resumeT, runtime);
  updateChip();
  play();
}

function fillEpisodes() {
  $('episode').innerHTML = Array.from({length:30}, (_, i) => `<option value="${i+1}">E${i+1}</option>`).join('');
}

function buildUrl() {
  const s = SOURCES[+$('src').value];
  const url = current.type === 'tv'
    ? s.tv(current.id, $('season').value || 1, $('episode').value || 1)
    : s.m(current.id);
  if (resumeT < 10) return url;
  const u = new URL(url);
  u.searchParams.set('autoplay', '1');
  if (u.hostname === 'vidlink.pro') u.searchParams.set('startAt', Math.floor(resumeT));
  else u.searchParams.set('t', Math.floor(resumeT));
  return u.toString();
}

function play() {
  const url = buildUrl();
  frame.hidden = false; vid.hidden = true;
  frame.src = url;
  $('tab').onclick = () => window.open(url, '_blank', 'noopener');
  startClock();
  if (resumeT > 15) {
    setTimeout(() => seek(resumeT), 2600);
    setTimeout(() => seek(resumeT), 6500);
  }
}

$('src').onchange = () => {
  const rec = allPos()[posId()];
  if (rec && clock) resumeT = Math.max(resumeT, clock.base);
  updateChip();
  play();
};
$('season').onchange = () => {
  stopClock();
  fillEpisodes();
  const rec = allPos()[posId()];
  resumeT = rec && !isDone(rec) ? rec.t : 0;
  updateChip();
  play();
};
$('episode').onchange = () => {
  stopClock();
  const rec = allPos()[posId()];
  resumeT = rec && !isDone(rec) ? rec.t : 0;
  updateChip();
  play();
};
$('r-go').onclick = () => { seek(resumeT); toast(`Jumping to ${mmss(resumeT)}`); };
$('r-new').onclick = () => {
  resumeT = 0;
  setPos(0, runtime);
  updateChip();
  play();
};
$('back').onclick = () => {
  closeSheet();
  stopClock();
  frame.src = 'about:blank';
  vid.pause(); vid.removeAttribute('src');
  $('q').value = '';
  current = null;
  home();
  $('q').focus();
};

/* ---------- download sheet ---------- */

$('get').onclick = openSheet;
$('sh-x').onclick = closeSheet;
sheet.onclick = e => { if (e.target === sheet) closeSheet(); };

function epPath() {
  return current.type === 'tv'
    ? `${current.id}/${$('season').value || 1}/${$('episode').value || 1}`
    : `${current.id}`;
}
function pageUrl() {
  return current.type === 'tv' ? `${DL}/tv/${epPath()}` : `${DL}/movie/${current.id}`;
}

function openSheet() {
  if (!current) return;
  sheet.hidden = false;
  subs = ''; fmt = 'mp4';
  $('sh-t').textContent = `Download · ${current.title}`;
  $('sh-page').href = pageUrl();
  $('sh-copy').onclick = () => navigator.clipboard?.writeText(pageUrl())
    .then(() => toast('Link copied'), () => toast(pageUrl()));
  loadLinks();
}

function closeSheet() { sheet.hidden = true; }

async function loadLinks() {
  shBody.innerHTML = '<p class="mut">Looking for download links…</p>';
  const api = current.type === 'tv'
    ? `${DL}/api/download/tv/${epPath()}?json=1`
    : `${DL}/api/download/movie/${current.id}?json=1`;
  let data = null;
  try {
    const r = await fetch(api, { cache: 'no-store' });
    if (r.ok) data = await r.json();
  } catch {}
  if (!data || !data.downloads || !data.downloads.length) {
    shBody.innerHTML = `<p class="mut">Couldn't pull links directly (no source, or the request was blocked).
      Use the download page below — it lists the same files.</p>`;
    return;
  }
  renderLinks(data);
}

function fileUrl(entry, format) {
  const base = format === 'mkv' ? entry.mkv : entry.mp4;
  if (!base) return '';
  const u = new URL(base);
  if (subs) u.searchParams.set('sub', subs);
  return u.toString();
}

function renderLinks(data) {
  const langs = [...new Set((data.subtitles || []).map(s => s.lang).filter(Boolean))].slice(0, 14);
  shBody.innerHTML = `
    <div class="fmt">
      <button data-f="mp4" class="on">MP4</button>
      <button data-f="mkv">MKV</button>
    </div>
    ${langs.length ? `<p class="mut" style="margin:0 0 8px">Subtitles burned in:
      <select id="subsel"><option value="">none</option>
      ${langs.map(l => `<option value="${esc(l)}">${esc(l)}</option>`).join('')}</select></p>` : ''}
    <div id="rows"></div>
    <p class="mut">MP4 plays in-app offline. MKV saves to the device but won't play here.</p>`;

  shBody.querySelectorAll('.fmt button').forEach(b => {
    b.onclick = () => {
      fmt = b.dataset.f;
      shBody.querySelectorAll('.fmt button').forEach(x => x.classList.toggle('on', x === b));
      refreshRows(data);
    };
  });
  const subsel = $('subsel');
  if (subsel) subsel.onchange = () => { subs = subsel.value; refreshRows(data); };
  refreshRows(data);
}

function refreshRows(data) {
  const rows = $('rows');
  rows.innerHTML = '';
  data.downloads.forEach(entry => {
    const url = fileUrl(entry, fmt);
    const row = document.createElement('div');
    row.className = 'qrow';
    row.innerHTML = `<div><span class="ql">${esc(entry.quality || 'auto')}</span>
      <span class="qs">${esc(entry.sizeLabel || '')} · ${fmt.toUpperCase()}</span></div>
      <button>⬇ Save</button>
      <a href="${url}" target="_blank" rel="noopener">↗</a>
      <i class="pg"><u></u></i>`;
    const btn = row.querySelector('button');
    const bar = row.querySelector('.pg');
    btn.onclick = () => saveOffline(entry, url, bar, btn);
    rows.append(row);
  });
}

/* ---------- offline save ---------- */

async function saveOffline(entry, url, bar, btn) {
  if (!('caches' in window)) return toast('This browser has no offline storage.');
  if (!navigator.serviceWorker || !navigator.serviceWorker.controller)
    return toast('Reload the app once so offline storage can start.');

  const key = `${current.type}-${current.id}-${current.type === 'tv' ? ($('season').value || 1) + 'x' + ($('episode').value || 1) : 'm'}-${entry.quality}`;
  if (busy.has(key)) { btn.textContent = '⬇ Save'; busy.delete(key); return; }

  busy.add(key);
  btn.textContent = '✕';
  bar.classList.add('on');

  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    const res = await fetch(url);
    if (!res.ok || !res.body) throw new Error('fetch');
    const total = +(res.headers.get('content-length') || 0) || entry.size || 0;
    const reader = res.body.getReader();
    const chunks = [];
    let got = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      if (!busy.has(key)) { reader.cancel(); btn.textContent = '⬇ Save'; bar.classList.remove('on'); return; }
      chunks.push(value);
      got += value.length;
      if (total) bar.firstElementChild.style.width = Math.min(100, got / total * 100) + '%';
    }

    const blob = new Blob(chunks, { type: 'video/mp4' });
    const cache = await caches.open(DL_CACHE);
    await cache.put('/__dl__/' + key,
      new Response(blob, { headers: { 'Content-Type': 'video/mp4', 'Content-Length': blob.size } }));

    addRecord({
      key, id: current.id, type: current.type, title: current.title,
      poster: current.poster, quality: entry.quality, size: blob.size,
      ep: current.type === 'tv' ? `${$('season').value}x${$('episode').value}` : '', ts: Date.now()
    });
    bar.firstElementChild.style.width = '100%';
    btn.textContent = '✓';
    toast('Saved for offline playback');
  } catch (e) {
    btn.textContent = '⬇ Save';
    bar.classList.remove('on');
    toast(/quota/i.test(e.name + e.message) ? 'Not enough space for this file.' : 'Save failed — use ↗ to download instead.');
  } finally {
    busy.delete(key);
  }
}

/* ---------- download records ---------- */

function readRecords() {
  try { return JSON.parse(localStorage.getItem(DL_STORE)) || []; } catch { return []; }
}
function writeRecords(list) {
  try { localStorage.setItem(DL_STORE, JSON.stringify(list.slice(0, 300))); } catch {}
}
function addRecord(rec) {
  const list = readRecords().filter(r => r.key !== rec.key);
  list.unshift(rec);
  writeRecords(list);
  if (!dgrid.hidden) renderDownloads();
}
function dropRecord(key) {
  writeRecords(readRecords().filter(r => r.key !== key));
  caches.open(DL_CACHE).then(c => c.delete('/__dl__/' + key)).catch(() => {});
  renderDownloads();
}

function renderDownloads() {
  stopClock();
  const list = readRecords();
  view.style.display = 'none';
  $('back').hidden = true;
  grid.innerHTML = '';
  dgrid.hidden = false;
  dgrid.innerHTML = '';
  hint.textContent = list.length ? '' : 'Nothing saved yet. Tap ⤓ while watching something.';
  list.forEach(r => {
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `<div class="wrap"><img loading="lazy" src="${esc(r.poster)}" alt="">
      <button class="rm">✕</button></div>
      <b>${esc(r.title)}</b>
      <span class="meta">${esc(r.quality || '')}${r.ep ? ' · ' + esc(r.ep) : ''} · ${r.size ? (r.size / 1048576).toFixed(0) + ' MB' : ''}</span>`;
    c.onclick = () => playCached(r);
    c.querySelector('.rm').onclick = e => { e.stopPropagation(); dropRecord(r.key); };
    dgrid.append(c);
  });
}

function playCached(rec) {
  stopClock();
  current = { id: rec.id, type: rec.type, title: rec.title, poster: rec.poster };
  $('title').textContent = rec.title;
  $('src').hidden = $('tab').hidden = true;
  $('season').hidden = $('episode').hidden = true;
  $('resume').hidden = true;
  grid.innerHTML = ''; dgrid.hidden = true; hint.textContent = '';
  view.style.display = 'block';
  $('back').hidden = false;
  frame.hidden = true; vid.hidden = false;
  vid.src = '/__dl__/' + rec.key;
  vid.play().catch(() => {});
  $('get').onclick = () => toast('Already saved. Tap ✕ in Downloads to remove it.');
}

$('dlb').onclick = () => {
  const wasHidden = dgrid.hidden;
  if (wasHidden) renderDownloads();
  else { $('q').value = ''; current = null; home(); }
};

applyGuard();
home();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
